<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติหัวข้อ — WEZIDE</title>

<meta property="og:title" content="ประวัติหัวข้อ — WEZIDE">
<meta property="og:description" content="ย้อนดูหัวข้อที่จบการโหวตไปแล้วทั้งหมด">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100;400;700&family=Lexend:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<style>
  :root{
    --primary: #5B2A9E;
    --primary-dark: #3A1B66;
    --primary-light: #8B5FD1;
    --accent: #FFC93C;
    --bg: #F3F1F7;
    --surface: #FFFFFF;
    --text: #1C1329;
    --text-muted: #6E6680;
    --line: #E6E2EF;
    --side-a: #4B2C82;
    --side-b: #FFC93C;
    --danger: #D64545;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(59, 27, 102, 0.08);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif; font-weight:400; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4, .btn{ font-family:'Lexend', sans-serif; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  /* ===== Header (เหมือน index.html/profile.html เพื่อความต่อเนื่อง) ===== */
  header.site-header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo-wrap{ display:flex; align-items:center; gap:8px; }
  .brand{ font-family:'Antonio',sans-serif; font-weight:700; font-size:24px; color:var(--primary); letter-spacing:0.5px; }
  .btn{
    padding:9px 18px; border-radius:100px; font-size:14px; font-weight:500;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-ghost{ background:var(--surface); color:var(--primary); border:1.5px solid var(--line); }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .lang-toggle{ display:flex; align-items:center; background:var(--bg); border:1.5px solid var(--line); border-radius:100px; padding:3px; gap:2px; flex-shrink:0; }
  .lang-toggle button{ padding:5px 12px; border-radius:100px; font-size:12px; font-weight:700; font-family:'Lexend', sans-serif; color:var(--text-muted); transition:all .15s ease; }
  .lang-toggle button.active{ background:var(--primary); color:#fff; }

  /* ===== Page head (เต็มความกว้างเหมือน index.html ไม่ centered ให้ลอยกลางจอ) ===== */
  .page-head{ padding:22px 20px 4px; }
  .page-head h1{ font-size:20px; margin:0 0 4px; }
  .page-head p{ font-size:13px; color:var(--text-muted); margin:0; }

  /* ===== Filter bar (เต็มความกว้างเหมือน index.html) ===== */
  .filter-bar{
    position:sticky; top:63px; z-index:40; background:var(--bg);
    padding:14px 20px 10px; border-bottom:1px solid var(--line);
  }
  .sort-row{ display:flex; justify-content:flex-start; margin-bottom:10px; }
  .view-toggle{ display:flex; background:var(--surface); border:1.5px solid var(--line); border-radius:100px; padding:3px; }
  .view-toggle button{ padding:6px 14px; border-radius:100px; font-size:12.5px; color:var(--text-muted); }
  .view-toggle button.active{ background:var(--primary); color:#fff; }
  .pill-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .category-pill{
    flex-shrink:0; padding:8px 16px; border-radius:100px; font-size:13px;
    background:var(--surface); border:1.5px solid var(--line); color:var(--text-muted);
    white-space:nowrap; transition:all .15s ease;
  }
  .category-pill.selected{ background:var(--primary); border-color:var(--primary); color:#fff; font-weight:500; }
  .result-count{ font-size:12.5px; color:var(--text-muted); padding:10px 2px 0; }
  .result-count b{ color:var(--text); }

  /* ===== History list (บาง แคบ ไม่มีรูป) ===== */
  .history-list{ max-width:640px; margin:0 auto; padding:16px 16px 40px; display:flex; flex-direction:column; gap:10px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .emoji{ font-size:36px; margin-bottom:10px; }
  .area-loading{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 20px; color:var(--text-muted); font-size:13px; }
  .area-spinner{ width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .history-card{
    background:var(--surface); border-radius:12px; border:1px solid var(--line);
    padding:12px 14px; box-shadow:0 2px 8px rgba(59,27,102,0.05);
  }
  .hc-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .hc-title{ font-size:14px; font-weight:600; line-height:1.4; color:var(--text); }
  .hc-cat{
    flex-shrink:0; background:var(--bg); color:var(--text-muted); font-size:10.5px;
    padding:3px 9px; border-radius:100px; white-space:nowrap; margin-top:1px;
  }
  .hc-desc{
    font-size:12px; color:var(--text-muted); margin:2px 0 9px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hc-bar{ height:9px; border-radius:5px; background:var(--bg); overflow:hidden; display:flex; margin-bottom:6px; }
  .hc-bar span{ height:100%; transition:width .5s ease; }
  .hc-bar .a{ background:var(--side-a); }
  .hc-bar .b{ background:var(--side-b); }
  .hc-result{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-muted); }
  .hc-result .hr-total{ font-weight:600; color:var(--text); margin-bottom:1px; }
  .hc-result .hr-row{ display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hc-result .hr-dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; display:inline-block; }
  .hc-result .win{ color:var(--primary); font-weight:700; }

  /* ===== Pagination (เหมือน index.html) ===== */
  .pagination-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    padding:6px 20px 30px;
  }
  .page-size-select{
    margin-left:auto; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--surface); font-size:12.5px; color:var(--text-muted); outline:none;
  }
  .page-btn{
    min-width:34px; height:34px; padding:0 8px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600;
  }
  .page-btn.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .page-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .page-ellipsis{ color:var(--text-muted); padding:0 2px; font-size:13px; }
  @media(max-width:480px){ .page-size-select{ margin-left:0; width:100%; order:10; } }

  /* ===== Modals (subset ที่จำเป็น คัดมาจาก index.html เพื่อรองรับ language picker / error popup ของฟีเจอร์แปล) ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,19,41,0.55); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  @media(min-width:520px){ .modal-overlay{ align-items:center; } }
  .modal-box{
    background:var(--surface); width:100%; max-width:420px; border-radius:20px 20px 0 0;
    padding:24px 22px 28px; max-height:88vh; overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @media(min-width:520px){ .modal-box{ border-radius:20px; } }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h3{ margin:0; font-size:18px; font-weight:600; }
  .modal-close{ font-size:20px; color:var(--text-muted); width:30px; height:30px; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .full-btn{ width:100%; padding:13px; border-radius:12px; font-size:15px; font-weight:600; }

  /* --- mini dashboard (เพศ/อายุ) บนการ์ด History — ปิดไว้เป็นค่าเริ่มต้นเสมอ กันกินพื้นที่จอ (เหมือน index.html) --- */
  /* --- comment buttons: อยู่ใต้แถบผลโหวตเสมอ คนละปุ่มคนละฝั่ง (A/B) โชว์ตลอดกดได้เสมอแม้ N=0 --- */
  .comment-row{ display:flex; gap:8px; margin-top:10px; }
  .comment-btn{
    flex:1; text-align:center; font-size:12px; font-weight:600; color:var(--text-muted);
    background:var(--bg); border:1.5px solid var(--line); border-radius:100px; padding:7px 8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .comment-btn:active{ background:var(--line); }

  /* --- comment modal: list + infinite scroll ผ่าน IntersectionObserver --- */
  .comment-list{ display:flex; flex-direction:column; gap:10px; min-height:60px; }
  .comment-item{
    background:var(--bg); border-radius:12px; padding:10px 14px; font-size:13.5px;
    line-height:1.6; color:var(--text); white-space:pre-wrap; word-break:break-word;
  }
  .comment-item-time{ display:block; margin-top:6px; font-size:11px; color:var(--text-muted); }
  .comment-empty, .comment-loading{ text-align:center; font-size:13px; color:var(--text-muted); padding:26px 0; }
  #commentSentinel{ height:1px; }

  .mini-dash{ border-top:1px solid var(--line); padding:10px 0 0; margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .mini-dash-title{ font-size:11.5px; color:var(--text-muted); font-weight:500; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .mini-dash-summary{ display:inline-flex; align-items:center; gap:4px; }
  .dash-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; background:var(--bg);
    color:var(--text-muted); font-size:10px; line-height:1; flex-shrink:0;
    transition:transform .2s ease, background .15s ease;
  }
  .dash-toggle-btn:active{ background:var(--line); }
  .dash-toggle-btn.open{ transform:rotate(180deg); }
  .mini-dash-body{ max-height:0; opacity:0; overflow:hidden; transition:max-height .3s ease, opacity .25s ease; display:flex; flex-direction:column; gap:12px; }
  .mini-dash-body.open{ max-height:600px; opacity:1; }

  /* เพศ(donut ซ้าย) + ช่วงอายุ(bar ขวา) เคียงข้างกันเสมอ ไม่ stack แม้จอแคบ — sync กับ index.html */
  .dash-cols{ display:flex; align-items:flex-start; gap:10px; }
  .dash-group{ display:flex; flex-direction:column; gap:6px; }
  .dash-group-gender{ flex:0 0 auto; }
  .dash-group-age{ flex:1 1 auto; min-width:0; }
  .dash-group-title{ font-size:13px; font-weight:700; color:var(--text); }
  .dash-item-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
  .dash-item-label{ width:44px; flex-shrink:0; }
  .dash-item-bg{ flex:1; height:8px; border-radius:4px; background:var(--bg); overflow:hidden; }
  .dash-item-fill{ display:block; height:100%; border-radius:4px; transition:width .5s ease; }
  .dash-item-fill.zero{ background:var(--line) !important; }
  .dash-item-pct{ width:30px; flex-shrink:0; text-align:right; font-weight:600; color:var(--text); }
  @media(max-width:360px){
    .dash-cols{ gap:8px; }
    .dash-item-label{ width:38px; }
    .dash-item-pct{ width:26px; }
  }

  /* --- gender donut chart (sync กับ index.html) --- */
  .dash-donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dash-donut{ display:block; }
  .dash-donut circle{ transition:stroke-dasharray .5s ease; }
  .dash-legend{ display:flex; flex-direction:column; gap:2px; width:100%; }
  .dash-legend-row{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); white-space:nowrap; }
  .dash-legend-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dash-legend-label{ flex-shrink:0; }
  .dash-legend-pct{ font-weight:600; color:var(--text); margin-left:auto; }

  /* --- translate button --- */
  .translate-row{ margin-top:8px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .translate-btn{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--primary); padding:2px; }
  .translate-btn .tr-icon{ font-size:13px; }
  .translate-btn.loading{ opacity:.55; pointer-events:none; }
  .tr-translated-note{ font-size:12px; color:var(--text-muted); display:inline-flex; align-items:center; gap:4px; }
  .translate-original-link, .translate-change-link{ font-size:12px; color:var(--primary); text-decoration:underline; font-weight:500; }
  .lang-pick-grid{ display:flex; flex-direction:column; gap:6px; max-height:56vh; overflow-y:auto; }
  .lang-pick-btn{ text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; font-weight:500; color:var(--text); background:var(--bg); }
  .lang-pick-btn:active{ background:var(--surface); border-color:var(--primary); }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--primary-dark); color:#fff; padding:12px 22px; border-radius:100px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200;
    max-width:90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo-wrap" href="index.html">
    <span class="brand">WEZIDE</span>
  </a>
  <div class="header-actions">
    <div class="lang-toggle" id="langToggle">
      <button type="button" data-lang="th">TH</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <a class="btn btn-ghost" href="index.html" data-i18n="backHome">← กลับหน้าแรก</a>
  </div>
</header>

<div class="page-head">
  <h1 data-i18n="historyPageTitle">🕓 ประวัติหัวข้อ</h1>
  <p data-i18n="historyPageDesc">รวมหัวข้อที่จบการโหวตไปแล้ว ย้อนดูผลลัพธ์กันได้ที่นี่</p>
</div>

<div class="filter-bar">
  <div class="sort-row">
    <div class="view-toggle" id="sortToggle">
      <button data-sort="latest" class="active" data-i18n="sortLatest">ล่าสุด</button>
      <button data-sort="popular" data-i18n="sortPopular">ยอดนิยม</button>
    </div>
  </div>
  <div class="pill-row" id="categoryPills"></div>
  <div class="result-count" id="resultCount"></div>
</div>

<main class="history-list" id="historyList">
  <div class="area-loading"><div class="area-spinner"></div><span data-i18n="loadingText">กำลังโหลด...</span></div>
</main>
<div class="pagination-row" id="paginationRow"></div>

<div id="toast"></div>

<!-- ===== Comment List Modal (อ่านความคิดเห็นแบบ public/anonymous แยกฝั่ง A/B, infinite scroll ทีละ 20) ===== -->
<div class="modal-overlay" id="commentModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="commentModalTitle"></h3>
      <button class="modal-close" data-close="commentModal">✕</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div id="commentSentinel"></div>
  </div>
</div>

<!-- ===== Translate Language Picker Modal (โผล่ตอนกดปุ่ม "แปล" ครั้งแรกในเซสชัน — เลือกครั้งเดียวจำไว้ใช้กับการ์ดถัดไป) ===== -->
<div class="modal-overlay" id="translateLangModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Translate to</h3>
      <button class="modal-close" data-close="translateLangModal">✕</button>
    </div>
    <div class="lang-pick-grid" id="langPickGrid"></div>
  </div>
</div>

<!-- ===== Translate Error Modal (ข้อความคงที่เป็น EN เสมอ ตามที่ตกลงกัน ไม่ว่า error จริงจะเป็นอะไร) ===== -->
<div class="modal-overlay" id="translateErrorModal">
  <div class="modal-box" style="text-align:center;">
    <button class="modal-close" data-close="translateErrorModal" style="margin-left:auto;display:block;">✕</button>
    <div style="font-size:32px;margin-bottom:8px;">😕</div>
    <h3 style="margin:0 0 6px;">Oops! Something went wrong.</h3>
    <p style="font-size:13.5px;color:var(--text-muted);margin:0 0 22px;">Please try again.</p>
    <button class="btn btn-primary full-btn" id="translateRetryBtn">Try Again</button>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwUBBRSKVfEkr-FmanTnQ1pHDD_-gNQ53pWkzHLvm3kvDWSTu-ARtV70yXiuN8hep8Gmg/exec'
};

/* ================= I18N (TH ⇄ EN toggle สำหรับข้อความระบบ/static UI) =================
   Object แยกต่างหากจาก index.html/profile.html ตาม pattern เดิม, ใช้ key 'wz_lang' ร่วมกันเพื่อ sync ข้ามหน้า */
const LANG_KEY = 'wz_lang';
const I18N = {
  th: {
    backHome: '← กลับหน้าแรก', historyPageTitle: '🕓 ประวัติหัวข้อ',
    historyPageDesc: 'รวมหัวข้อที่จบการโหวตไปแล้ว ย้อนดูผลลัพธ์กันได้ที่นี่',
    sortLatest: 'ล่าสุด', sortPopular: 'ยอดนิยม', loadingText: 'กำลังโหลด...',
    loadFailed: 'โหลดข้อมูลไม่สำเร็จ', emptyHistory: 'ยังไม่มีหัวข้อที่จบการโหวตในหมวดนี้',
    foundPrefix: 'พบ', foundSuffix: 'หัวข้อที่จบการโหวตแล้ว',
    genderMale: 'ชาย', genderFemale: 'หญิง', genderOther: 'อื่นๆ',
    dashGenderTitle: 'เพศ', dashAgeGroupTitle: 'ช่วงอายุ',
    commentEmptyMsg: 'ยังไม่มีความคิดเห็นในฝั่งนี้',
    commentLoadingText: 'กำลังโหลดความคิดเห็น...', apiErrorMsg: 'โอ๊ะ! มีบางอย่างขัดข้อง ทำให้ระบบสะดุดครับ ลองรีเฟรชใหม่อีกครั้งนะครับ'
  },
  en: {
    backHome: '← Back to Home', historyPageTitle: '🕓 Topic History',
    historyPageDesc: 'All topics that have finished voting. Look back at the results here.',
    sortLatest: 'Latest', sortPopular: 'Popular', loadingText: 'Loading...',
    loadFailed: 'Failed to load data', emptyHistory: 'No finished topics in this category yet',
    foundPrefix: 'Found', foundSuffix: 'finished topics',
    genderMale: 'Male', genderFemale: 'Female', genderOther: 'Other',
    dashGenderTitle: 'Gender', dashAgeGroupTitle: 'Age Group',
    commentEmptyMsg: 'No comments on this side yet',
    commentLoadingText: 'Loading comments...', apiErrorMsg: 'Oops! Something went wrong. Please try refreshing and try again.'
  }
};
function getLang(){ return localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'th'; }
function t(key){ const lang = getLang(); return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.th[key] || ''); }
// alias ของ t() ไว้ใช้ในจุดที่มีตัวแปร local ชื่อ t ทับอยู่แล้ว (เช่น historyCardHTML(t)) กันเรียก t('key')
// แล้วดันไปชนกับ topic object แทนฟังก์ชันแปลภาษา (pattern เดียวกับ index.html)
const t18n = t;
function applyLang(lang){
  const dict = I18N[lang] || I18N.th;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.innerHTML = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if(dict[key] !== undefined) el.placeholder = dict[key];
  });
  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.documentElement.lang = lang;
}
function setLang(lang){
  localStorage.setItem(LANG_KEY, lang);
  applyLang(lang);
  loadHistory(); // เนื้อหา empty-state/result-count เป็น dynamic HTML ต้อง re-render ใหม่ตอนสลับภาษา
}
document.querySelectorAll('.lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.dataset.lang));
});
applyLang(getLang());

let STATE = {
  categories: [],
  activeCategory: '',
  sortMode: 'latest',
  page: 1,
  pageSize: 20,
  totalCount: 0,
  totalPages: 1,
  topics: []
};

/* ---------- API helper (เหมือน index.html/profile.html ใส่ timeout 20 วิกันปุ่มค้าง) ---------- */
async function api(action, params = {}, method = 'GET'){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try{
    if(method === 'GET'){
      const qs = new URLSearchParams({action, ...params}).toString();
      const res = await fetch(`${CONFIG.API_URL}?${qs}`, { signal: controller.signal });
      return await res.json();
    } else {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        body: JSON.stringify({action, ...params}),
        signal: controller.signal
      });
      return await res.json();
    }
  }catch(err){
    // กันทุกกรณี error ไม่ให้หลุดเป็น unhandled exception ที่ทำให้หน้าจอค้างเป็น spinner ตลอดกาล
    return { success:false, message:'โอ๊ะ! มีบางอย่างขัดข้อง ทำให้ระบบสะดุดครับ ลองรีเฟรชใหม่อีกครั้งนะครับ' };
  }finally{
    clearTimeout(timeoutId);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ---------- Category filter ---------- */
async function loadCategories(){
  const res = await api('getCategories');
  STATE.categories = res.success ? res.categories : [];
  const wrap = document.getElementById('categoryPills');
  wrap.innerHTML = '';
  const allPill = document.createElement('button');
  allPill.className = 'category-pill selected';
  allPill.textContent = 'All';
  allPill.addEventListener('click', ()=> selectCategory('', allPill));
  wrap.appendChild(allPill);

  STATE.categories.forEach(cat=>{
    const pill = document.createElement('button');
    pill.className = 'category-pill';
    pill.textContent = cat;
    pill.addEventListener('click', ()=> selectCategory(cat, pill));
    wrap.appendChild(pill);
  });
}

function selectCategory(cat, el){
  STATE.activeCategory = cat;
  STATE.page = 1;
  document.querySelectorAll('.category-pill').forEach(p=> p.classList.remove('selected'));
  if(el) el.classList.add('selected');
  loadHistory();
}

document.getElementById('sortToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-sort]');
  if(!btn) return;
  STATE.sortMode = btn.dataset.sort;
  STATE.page = 1;
  document.querySelectorAll('#sortToggle button').forEach(b=> b.classList.toggle('active', b === btn));
  loadHistory();
});

/* ---------- Load + render ---------- */
async function loadHistory(){
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = `<div class="area-loading"><div class="area-spinner"></div>กำลังโหลด...</div>`;

  const params = { page: STATE.page, page_size: STATE.pageSize, sort: STATE.sortMode };
  if(STATE.activeCategory) params.category = STATE.activeCategory;

  const res = await api('getTopicHistory', params);
  if(!res.success){
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div>${escapeHtml(res.message || t('loadFailed'))}</div>`;
    document.getElementById('paginationRow').innerHTML = '';
    document.getElementById('resultCount').textContent = '';
    return;
  }

  STATE.topics = res.topics;
  STATE.totalCount = res.count;
  STATE.totalPages = res.total_pages;
  STATE.page = res.page;
  STATE.pageSize = res.page_size;

  document.getElementById('resultCount').innerHTML = STATE.totalCount
    ? `${t('foundPrefix')} <b>${STATE.totalCount}</b> ${t('foundSuffix')}`
    : '';

  if(STATE.topics.length === 0){
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">🗂️</div>${t('emptyHistory')}</div>`;
    document.getElementById('paginationRow').innerHTML = '';
    return;
  }

  listEl.innerHTML = STATE.topics.map(historyCardHTML).join('');
  bindCardEvents(listEl);
  renderPagination();

  // โหลด gender/age breakdown แยกทีหลัง (lazy) เหมือน index.html — ไม่บล็อกการโชว์ลิสต์หลัก
  loadDashboards();
}

// ผูก event listener ให้การ์ด History — แยกเป็นฟังก์ชันกลาง เรียกซ้ำได้ทั้งตอน render ลิสต์ทั้งก้อน
// (scope = #historyList) และตอน re-render การ์ดเดี่ยวๆ หลังกดแปลภาษา/ดูต้นฉบับ (scope = การ์ดใบนั้นใบเดียว)
function bindCardEvents(scopeEl){
  scopeEl.querySelectorAll('[data-dash-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleDashSummary(btn.dataset.dashToggle));
  });
  scopeEl.querySelectorAll('.comment-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openCommentModal(btn.dataset.commentTopic, btn.dataset.commentSide, btn.dataset.commentLabel));
  });
  scopeEl.querySelectorAll('[data-tr-topic]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleTranslateClick(btn.dataset.trTopic));
  });
  scopeEl.querySelectorAll('[data-tr-original]').forEach(btn=>{
    btn.addEventListener('click', ()=> revertTranslation(btn.dataset.trOriginal));
  });
  scopeEl.querySelectorAll('[data-tr-change]').forEach(btn=>{
    btn.addEventListener('click', ()=> openLangPickerFor(btn.dataset.trChange));
  });
}

// เปิด/ปิด voter summary ของการ์ดนั้นๆ — ปิดไว้เป็นค่าเริ่มต้นเสมอ เพื่อไม่ให้กินพื้นที่จอโดยไม่จำเป็น
function toggleDashSummary(topicId){
  const body = document.getElementById(`dashBody-${topicId}`);
  const btn = document.querySelector(`.dash-toggle-btn[data-dash-toggle="${topicId}"]`);
  if(!body || !btn) return;
  const willOpen = !body.classList.contains('open');
  body.classList.toggle('open', willOpen);
  btn.classList.toggle('open', willOpen);
  btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}

// สีเพศตายตัวเสมอ ไม่ผูกกับ card_color ของหัวข้อ (sync กับ index.html)
const GENDER_BAR_DEFS = [
  { key:'ชาย', color:'#00A1FF', labelKey:'genderMale' },
  { key:'หญิง', color:'#FF42A1', labelKey:'genderFemale' },
  { key:'อื่นๆ', color:'#8E7CC3', labelKey:'genderOther' }
];
const AGE_BAR_ORDER = ['18-24','25-34','35-44','45-54','55+'];

// สร้าง 1 แถวบาร์ (label ซ้าย + บาร์ + % ขวา) ช่วงที่ไม่มีคนโหวตเลย (0%) แสดงเป็นบาร์เทาเต็มเส้นบางๆ แทนที่จะว่างเปล่าไปเลย
function dashBarRowHTML(label, pct, color){
  const isZero = !pct;
  const fillWidth = isZero ? 100 : pct;
  return `<div class="dash-item-row">
    <span class="dash-item-label">${escapeHtml(label)}</span>
    <div class="dash-item-bg"><span class="dash-item-fill${isZero ? ' zero' : ''}" style="width:${fillWidth}%;${isZero ? '' : `background:${color}`}"></span></div>
    <span class="dash-item-pct">${pct || 0}%</span>
  </div>`;
}

// สร้าง donut chart (SVG ล้วน ไม่พึ่ง library ภายนอก) จากสัดส่วนเพศ + legend ใต้วง (label + %) — sync กับ index.html
const DASH_DONUT_SIZE = 72, DASH_DONUT_R = 27, DASH_DONUT_CX = 36, DASH_DONUT_CY = 36, DASH_DONUT_SW = 12;
function buildGenderDonutHTML(dash){
  const genderPct = dash.gender_percent || {};
  const total = GENDER_BAR_DEFS.reduce((sum, g) => sum + (genderPct[g.key] || 0), 0);
  const circumference = 2 * Math.PI * DASH_DONUT_R;

  let circlesHTML;
  if(!total){
    circlesHTML = `<circle cx="${DASH_DONUT_CX}" cy="${DASH_DONUT_CY}" r="${DASH_DONUT_R}" fill="none" stroke="var(--line)" stroke-width="${DASH_DONUT_SW}"/>`;
  } else {
    let acc = 0;
    circlesHTML = GENDER_BAR_DEFS.map(g => {
      const pct = genderPct[g.key] || 0;
      if(pct <= 0) return '';
      const segLen = (pct / 100) * circumference;
      const dashOffset = -(acc / 100) * circumference;
      acc += pct;
      return `<circle cx="${DASH_DONUT_CX}" cy="${DASH_DONUT_CY}" r="${DASH_DONUT_R}" fill="none" stroke="${g.color}" stroke-width="${DASH_DONUT_SW}" stroke-dasharray="${segLen} ${circumference - segLen}" stroke-dashoffset="${dashOffset}" transform="rotate(-90 ${DASH_DONUT_CX} ${DASH_DONUT_CY})"/>`;
    }).join('');
  }

  const legendHTML = GENDER_BAR_DEFS.map(g => {
    const pct = genderPct[g.key] || 0;
    return `<div class="dash-legend-row">
      <span class="dash-legend-dot" style="background:${g.color}"></span>
      <span class="dash-legend-label">${escapeHtml(t(g.labelKey))}</span>
      <span class="dash-legend-pct">${pct}%</span>
    </div>`;
  }).join('');

  return `<div class="dash-donut-wrap">
    <svg class="dash-donut" viewBox="0 0 ${DASH_DONUT_SIZE} ${DASH_DONUT_SIZE}" width="${DASH_DONUT_SIZE}" height="${DASH_DONUT_SIZE}">${circlesHTML}</svg>
    <div class="dash-legend">${legendHTML}</div>
  </div>`;
}

function renderDashboard(topicId, dash, cardColor){
  const el = document.getElementById(`dash-${topicId}`);
  if(!el) return;
  const ageColor = cardColor || '#5B2A9E';

  const genderDonutHTML = buildGenderDonutHTML(dash);
  const ageRows = AGE_BAR_ORDER.map(a => dashBarRowHTML(a, (dash.age_group_percent || {})[a] || 0, ageColor)).join('');

  el.innerHTML = `
    <div class="dash-cols">
      <div class="dash-group dash-group-gender">
        <div class="dash-group-title">${t('dashGenderTitle')}</div>
        ${genderDonutHTML}
      </div>
      <div class="dash-group dash-group-age">
        <div class="dash-group-title">${t('dashAgeGroupTitle')}</div>
        ${ageRows}
      </div>
    </div>`;
}

async function loadDashboards(){
  for(const t of STATE.topics){
    await loadDashboardFor(t.topic_id);
  }
}
async function loadDashboardFor(topicId){
  const t = STATE.topics.find(x=> x.topic_id === topicId);
  const res = await api('getTopicDetail', {topic_id: topicId});
  if(!res.success) return;
  renderDashboard(topicId, res.dashboard, t && t.card_color);

  // cache เลข comment count ไว้ที่ topic object เอง เผื่อ re-render การ์ด (เช่นหลังแปลภาษา) จะได้โชว์เลขที่มีอยู่แล้ว
  // ทันที โดยไม่ต้องรอโหลดใหม่ — อัพเดตแค่ label ของปุ่มในตำแหน่งเดิม ไม่ full re-render การ์ดทั้งใบ
  if(t){
    t._commentCountA = res.dashboard.comment_count_a || 0;
    t._commentCountB = res.dashboard.comment_count_b || 0;
    updateCommentBtnLabel(topicId, 'A', t._commentCountA);
    updateCommentBtnLabel(topicId, 'B', t._commentCountB);
  }
}

function updateCommentBtnLabel(topicId, side, count){
  const btn = document.querySelector(`.comment-btn[data-comment-topic="${topicId}"][data-comment-side="${side}"]`);
  if(btn) btn.textContent = `💬 ${count} comment`;
}

// re-render เฉพาะการ์ดเดียวหลังแปล/ย้อนกลับต้นฉบับ — ไม่แตะการ์ดอื่นในลิสต์ กัน scroll กระโดด/
// mini-dash การ์ดอื่นๆ ที่เปิดค้างอยู่ถูกปิดไปด้วยโดยไม่จำเป็น
function rerenderSingleCard(topicId){
  const t = STATE.topics.find(x=> x.topic_id === topicId);
  if(!t) return;
  const oldEl = document.querySelector(`.history-card[data-card-id="${topicId}"]`);
  if(!oldEl) return;

  const wasDashOpen = oldEl.querySelector('.mini-dash-body')?.classList.contains('open') || false;

  const wrap = document.createElement('div');
  wrap.innerHTML = historyCardHTML(t).trim();
  const newEl = wrap.firstElementChild;
  oldEl.replaceWith(newEl);
  bindCardEvents(newEl);

  if(wasDashOpen){
    const body = newEl.querySelector('.mini-dash-body');
    const toggleBtn = newEl.querySelector('.dash-toggle-btn');
    if(body) body.classList.add('open');
    if(toggleBtn){ toggleBtn.classList.add('open'); toggleBtn.setAttribute('aria-expanded','true'); }
  }
  loadDashboardFor(topicId);
}

/* ================= Comment Modal (public, anonymous, อ่านความคิดเห็นแยกฝั่ง A/B) =================
 * เหมือน index.html ทุกอย่าง (โหลดทีละ 20 รายการ, IntersectionObserver infinite scroll, ปุ่มกดได้เสมอแม้ N=0) */
let CM_STATE = { topicId:null, side:null, page:0, totalPages:1, loading:false, observer:null };

function formatCommentTime(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d)) return '';
  return d.toLocaleString(getLang()==='en' ? 'en-US' : 'th-TH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function openCommentModal(topicId, side, sideLabel){
  if(CM_STATE.observer) CM_STATE.observer.disconnect();
  CM_STATE = { topicId, side, page:0, totalPages:1, loading:false, observer:null };
  document.getElementById('commentModalTitle').textContent = sideLabel;
  document.getElementById('commentList').innerHTML = `<div class="comment-loading">${t18n('commentLoadingText')}</div>`;
  openModal('commentModal');
  loadMoreComments(true);
}

async function loadMoreComments(isFirst){
  if(CM_STATE.loading) return;
  if(!isFirst && CM_STATE.page >= CM_STATE.totalPages) return;
  CM_STATE.loading = true;

  const res = await api('getComments', {
    topic_id: CM_STATE.topicId, side: CM_STATE.side, page: CM_STATE.page + 1, page_size: 20
  });

  CM_STATE.loading = false;
  if(!res.success){
    if(isFirst) document.getElementById('commentList').innerHTML = `<div class="comment-empty">${t18n('apiErrorMsg')}</div>`;
    return;
  }

  CM_STATE.page = res.page;
  CM_STATE.totalPages = res.total_pages;

  const listEl = document.getElementById('commentList');
  if(isFirst) listEl.innerHTML = '';

  if(res.comments.length === 0 && isFirst){
    listEl.innerHTML = `<div class="comment-empty">${t18n('commentEmptyMsg')}</div>`;
  } else {
    listEl.insertAdjacentHTML('beforeend', res.comments.map(c => `
      <div class="comment-item">${escapeHtml(c.comment)}<span class="comment-item-time">${formatCommentTime(c.last_changed_at)}</span></div>
    `).join(''));
  }

  setupCommentObserver();
}

function setupCommentObserver(){
  if(CM_STATE.observer) CM_STATE.observer.disconnect();
  if(CM_STATE.page >= CM_STATE.totalPages) return;
  const sentinel = document.getElementById('commentSentinel');
  CM_STATE.observer = new IntersectionObserver((entries)=>{
    if(entries[0].isIntersecting) loadMoreComments(false);
  }, { root: document.querySelector('#commentModal .modal-box'), threshold: 0.1 });
  CM_STATE.observer.observe(sentinel);
}

/* ================= Translate (ปุ่ม "แปล" บนการ์ดหัวข้อ) =================
 * ปุ่มแปลอยู่ทุกการ์ดเสมอ ไม่เดาภาษาผู้ชม (ตามที่ตกลง เพื่อความง่าย/เร็ว/ชัวร์ 100%) เลือกภาษาครั้งแรก
 * ในเซสชันนี้ครั้งเดียวผ่าน modal แล้วจำไว้ กดแปลการ์ดถัดไปใช้ภาษาเดิมได้ทันที (มีปุ่ม "Change language"
 * ต่อการ์ดให้เปลี่ยนได้เสมอ) รายชื่อภาษาต้อง sync กับ TRANSLATE_LANGS ฝั่ง appscript.txt ทุกครั้งที่แก้ */
const TRANSLATE_LANGS = [
  {code:'en',    label:'English'},
  {code:'zh-CN', label:'中文 (简体)'},
  {code:'es',    label:'Español'},
  {code:'hi',    label:'हिन्दी'},
  {code:'ar',    label:'العربية'},
  {code:'pt',    label:'Português'},
  {code:'bn',    label:'বাংলা'},
  {code:'ru',    label:'Русский'},
  {code:'ja',    label:'日本語'},
  {code:'de',    label:'Deutsch'},
  {code:'fr',    label:'Français'},
  {code:'ko',    label:'한국어'},
  {code:'vi',    label:'Tiếng Việt'},
  {code:'id',    label:'Bahasa Indonesia'},
  {code:'th',    label:'ภาษาไทย'}
];

let TR_SESSION_LANG = null;
let TR_PENDING_TOPIC = null;
let TR_PENDING_RETRY = null;
const TR_CACHE = {};

function buildLangPickGrid(){
  const grid = document.getElementById('langPickGrid');
  if(!grid) return;
  grid.innerHTML = TRANSLATE_LANGS.map(l => `<button type="button" class="lang-pick-btn" data-lang="${l.code}">${escapeHtml(l.label)}</button>`).join('');
  grid.querySelectorAll('.lang-pick-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lang = btn.dataset.lang;
      closeModal('translateLangModal');
      if(!TR_PENDING_TOPIC) return;
      TR_SESSION_LANG = lang;
      const topicId = TR_PENDING_TOPIC;
      TR_PENDING_TOPIC = null;
      runTranslate(topicId, lang);
    });
  });
}
buildLangPickGrid();

function handleTranslateClick(topicId){
  if(TR_SESSION_LANG){ runTranslate(topicId, TR_SESSION_LANG); return; }
  openLangPickerFor(topicId);
}
function openLangPickerFor(topicId){
  TR_PENDING_TOPIC = topicId;
  openModal('translateLangModal');
}

async function runTranslate(topicId, lang){
  const btn = document.querySelector(`.translate-btn[data-tr-topic="${topicId}"]`);
  if(btn){ btn.classList.add('loading'); const lbl = btn.querySelector('.tr-label'); if(lbl) lbl.textContent = 'Translating...'; }

  const cacheKey = topicId + '_' + lang;
  const cached = TR_CACHE[cacheKey];
  if(cached){ applyTranslation(topicId, cached, lang); return; }

  const res = await api('translateTopic', { topic_id: topicId, target_lang: lang });
  if(!res.success){
    if(btn){ btn.classList.remove('loading'); const lbl = btn.querySelector('.tr-label'); if(lbl) lbl.textContent = 'Translate'; }
    TR_PENDING_RETRY = { topicId, lang };
    openModal('translateErrorModal');
    return;
  }
  TR_CACHE[cacheKey] = res.translated;
  applyTranslation(topicId, res.translated, lang);
}

function applyTranslation(topicId, translated, lang){
  const t = STATE.topics.find(x=> x.topic_id === topicId);
  if(!t) return;
  if(!t._original){
    t._original = { title:t.title, description:t.description, side_a_label:t.side_a_label, side_b_label:t.side_b_label };
  }
  t.title = translated.title;
  t.description = translated.description;
  t.side_a_label = translated.side_a_label;
  t.side_b_label = translated.side_b_label;
  t._translated = true;
  t._translatedLang = lang;
  rerenderSingleCard(topicId);
}

function revertTranslation(topicId){
  const t = STATE.topics.find(x=> x.topic_id === topicId);
  if(!t || !t._original) return;
  Object.assign(t, t._original);
  t._translated = false;
  t._translatedLang = null;
  rerenderSingleCard(topicId);
}

document.getElementById('translateRetryBtn').addEventListener('click', ()=>{
  closeModal('translateErrorModal');
  if(TR_PENDING_RETRY){
    const { topicId, lang } = TR_PENDING_RETRY;
    TR_PENDING_RETRY = null;
    runTranslate(topicId, lang);
  }
});

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=> closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal-overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target === ov) ov.classList.remove('open'); });
});

// การ์ดบาง แคบ ไม่มีรูป: title + description (บรรทัดเดียว) + แท่งสัดส่วน A/B วิ่งซ้าย->ขวา + % กำกับ (ฝั่งชนะตัวหนา) + total vote
function historyCardHTML(t){
  const total = t.total_votes || 0;
  const aPct = t.side_a_percent || 0;
  const bPct = t.side_b_percent || 0;
  const aWin = total > 0 && aPct > bPct;
  const bWin = total > 0 && bPct > aPct;

  return `
    <div class="history-card" data-card-id="${t.topic_id}">
      <div class="hc-top">
        <div class="hc-title">${escapeHtml(t.title)}</div>
        ${t.category ? `<span class="hc-cat">${escapeHtml(t.category)}</span>` : ''}
      </div>
      ${t.description ? `<div class="hc-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="hc-bar">
        <span class="a" style="width:${aPct}%"></span>
        <span class="b" style="width:${bPct}%"></span>
      </div>
      <div class="hc-result">
        <span class="hr-total">${total} โหวต (100%)</span>
        <span class="hr-row${aWin ? ' win' : ''}"><i class="hr-dot" style="background:var(--side-a)"></i>${aWin ? '🏆 ' : ''}${escapeHtml(t.side_a_label)} (${aPct}%)</span>
        <span class="hr-row${bWin ? ' win' : ''}"><i class="hr-dot" style="background:var(--side-b)"></i>${bWin ? '🏆 ' : ''}${escapeHtml(t.side_b_label)} (${bPct}%)</span>
      </div>

      <div class="comment-row">
        <button type="button" class="comment-btn" data-comment-topic="${t.topic_id}" data-comment-side="A" data-comment-label="${escapeHtml(t.side_a_label)}">💬 ${t._commentCountA !== undefined ? `${t._commentCountA} comment` : 'Comment'}</button>
        <button type="button" class="comment-btn" data-comment-topic="${t.topic_id}" data-comment-side="B" data-comment-label="${escapeHtml(t.side_b_label)}">💬 ${t._commentCountB !== undefined ? `${t._commentCountB} comment` : 'Comment'}</button>
      </div>

      ${translateRowHTML(t)}

      <div class="mini-dash">
        <div class="mini-dash-title">
          <span class="mini-dash-summary">
            สรุปผู้ร่วมโหวตทั้งหมด <b style="color:var(--primary)">${total}</b> คน
            <button class="dash-toggle-btn" data-dash-toggle="${t.topic_id}" aria-expanded="false" aria-label="แสดง/ซ่อนสรุปผู้ร่วมโหวต">▾</button>
          </span>
        </div>
        <div class="mini-dash-body" id="dashBody-${t.topic_id}">
          <div id="dash-${t.topic_id}"></div>
        </div>
      </div>
    </div>`;
}

// แถวปุ่มแปลภาษา — โชว์ทุกการ์ดเสมอ ไม่เดาภาษาผู้ชม (เหมือน index.html) ถ้าการ์ดนี้ถูกแปลอยู่แล้ว
// โชว์ label ภาษาที่แปลไป + ลิงก์สลับกลับต้นฉบับ + ลิงก์เปลี่ยนภาษา
function translateRowHTML(t){
  if(t._translated){
    const langLabel = (TRANSLATE_LANGS.find(l=>l.code===t._translatedLang)||{}).label || t._translatedLang;
    return `<div class="translate-row" data-tr-wrap="${t.topic_id}">
      <span class="tr-translated-note">🌐 Translated · ${escapeHtml(langLabel)}</span>
      <button type="button" class="translate-original-link" data-tr-original="${t.topic_id}">See original</button>
      <button type="button" class="translate-change-link" data-tr-change="${t.topic_id}">Change language</button>
    </div>`;
  }
  return `<div class="translate-row" data-tr-wrap="${t.topic_id}">
    <button type="button" class="translate-btn" data-tr-topic="${t.topic_id}">
      <span class="tr-icon">🌐</span><span class="tr-label">Translate</span>
    </button>
  </div>`;
}

function renderPagination(){
  const el = document.getElementById('paginationRow');
  if(STATE.totalCount === 0){ el.innerHTML = ''; return; }

  const cur = STATE.page;
  const total = STATE.totalPages;

  const pages = [];
  const addPage = n => pages.push(n);
  const windowStart = Math.max(2, cur - 1);
  const windowEnd = Math.min(total - 1, cur + 1);
  addPage(1);
  if(windowStart > 2) pages.push('...');
  for(let n = windowStart; n <= windowEnd; n++) addPage(n);
  if(windowEnd < total - 1) pages.push('...');
  if(total > 1) addPage(total);

  const pageBtns = pages.map(n =>
    n === '...'
      ? `<span class="page-ellipsis">…</span>`
      : `<button class="page-btn${n === cur ? ' active' : ''}" data-page="${n}">${n}</button>`
  ).join('');

  el.innerHTML = `
    <button class="page-btn" data-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>‹</button>
    ${pageBtns}
    <button class="page-btn" data-page="${cur + 1}" ${cur >= total ? 'disabled' : ''}>›</button>
    <select class="page-size-select" id="pageSizeSelect">
      <option value="20" ${STATE.pageSize===20?'selected':''}>แสดง 20 / หน้า</option>
      <option value="50" ${STATE.pageSize===50?'selected':''}>แสดง 50 / หน้า</option>
      <option value="100" ${STATE.pageSize===100?'selected':''}>แสดง 100 / หน้า</option>
    </select>
  `;

  el.querySelectorAll('.page-btn[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.page, 10);
      if(!n || n < 1 || n > STATE.totalPages || n === STATE.page) return;
      STATE.page = n;
      loadHistory();
      document.getElementById('historyList').scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  document.getElementById('pageSizeSelect').addEventListener('change', (e)=>{
    STATE.pageSize = parseInt(e.target.value, 10);
    STATE.page = 1;
    loadHistory();
  });
}

/* ---------- Init ---------- */
(async function init(){
  await loadCategories();
  await loadHistory();
})();
</script>
</body>
