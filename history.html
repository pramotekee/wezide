<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติหัวข้อ — WEZIDE</title>

<meta property="og:title" content="ประวัติหัวข้อ — WEZIDE">
<meta property="og:description" content="ย้อนดูหัวข้อที่จบการโหวตไปแล้วทั้งหมด">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100;400;700&family=Lexend:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>

</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>

<style>
  :root{
    --primary: #5B2A9E;
    --primary-dark: #3A1B66;
    --primary-light: #8B5FD1;
    --accent: #FFC93C;
    --bg: #F3F1F7;
    --surface: #FFFFFF;
    --text: #1C1329;
    --text-muted: #6E6680;
    --line: #E6E2EF;
    --side-a: #4B2C82;
    --side-b: #FFC93C;
    --danger: #D64545;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(59, 27, 102, 0.08);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif; font-weight:400; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4, .btn{ font-family:'Lexend', sans-serif; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  /* ===== Header (เหมือน index.html/profile.html เพื่อความต่อเนื่อง) ===== */
  header.site-header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo-wrap{ display:flex; align-items:center; gap:8px; }
  .brand{ font-family:'Antonio',sans-serif; font-weight:700; font-size:24px; color:var(--primary); letter-spacing:0.5px; }
  .btn{
    padding:9px 18px; border-radius:100px; font-size:14px; font-weight:500;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-ghost{ background:var(--surface); color:var(--primary); border:1.5px solid var(--line); }

  /* ===== Page head (เต็มความกว้างเหมือน index.html ไม่ centered ให้ลอยกลางจอ) ===== */
  .page-head{ padding:22px 20px 4px; }
  .page-head h1{ font-size:20px; margin:0 0 4px; }
  .page-head p{ font-size:13px; color:var(--text-muted); margin:0; }

  /* ===== Filter bar (เต็มความกว้างเหมือน index.html) ===== */
  .filter-bar{
    position:sticky; top:63px; z-index:40; background:var(--bg);
    padding:14px 20px 10px; border-bottom:1px solid var(--line);
  }
  .sort-row{ display:flex; justify-content:flex-start; margin-bottom:10px; }
  .view-toggle{ display:flex; background:var(--surface); border:1.5px solid var(--line); border-radius:100px; padding:3px; }
  .view-toggle button{ padding:6px 14px; border-radius:100px; font-size:12.5px; color:var(--text-muted); }
  .view-toggle button.active{ background:var(--primary); color:#fff; }
  .pill-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .category-pill{
    flex-shrink:0; padding:8px 16px; border-radius:100px; font-size:13px;
    background:var(--surface); border:1.5px solid var(--line); color:var(--text-muted);
    white-space:nowrap; transition:all .15s ease;
  }
  .category-pill.selected{ background:var(--primary); border-color:var(--primary); color:#fff; font-weight:500; }
  .result-count{ font-size:12.5px; color:var(--text-muted); padding:10px 2px 0; }
  .result-count b{ color:var(--text); }

  /* ===== History list (บาง แคบ ไม่มีรูป) ===== */
  .history-list{ max-width:640px; margin:0 auto; padding:16px 16px 40px; display:flex; flex-direction:column; gap:10px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .emoji{ font-size:36px; margin-bottom:10px; }
  .area-loading{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 20px; color:var(--text-muted); font-size:13px; }
  .area-spinner{ width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .history-card{
    background:var(--surface); border-radius:12px; border:1px solid var(--line);
    padding:12px 14px; box-shadow:0 2px 8px rgba(59,27,102,0.05);
  }
  .hc-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .hc-title{ font-size:14px; font-weight:600; line-height:1.4; color:var(--text); }
  .hc-cat{
    flex-shrink:0; background:var(--bg); color:var(--text-muted); font-size:10.5px;
    padding:3px 9px; border-radius:100px; white-space:nowrap; margin-top:1px;
  }
  .hc-desc{
    font-size:12px; color:var(--text-muted); margin:2px 0 9px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hc-bar{ height:9px; border-radius:5px; background:var(--bg); overflow:hidden; display:flex; margin-bottom:6px; }
  .hc-bar span{ height:100%; transition:width .5s ease; }
  .hc-bar .a{ background:var(--side-a); }
  .hc-bar .b{ background:var(--side-b); }
  .hc-result{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-muted); }
  .hc-result .hr-total{ font-weight:600; color:var(--text); margin-bottom:1px; }
  .hc-result .hr-row{ display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hc-result .hr-dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; display:inline-block; }
  .hc-result .win{ color:var(--primary); font-weight:700; }

  /* ===== Pagination (เหมือน index.html) ===== */
  .pagination-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    padding:6px 20px 30px;
  }
  .page-size-select{
    margin-left:auto; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--surface); font-size:12.5px; color:var(--text-muted); outline:none;
  }
  .page-btn{
    min-width:34px; height:34px; padding:0 8px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600;
  }
  .page-btn.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .page-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .page-ellipsis{ color:var(--text-muted); padding:0 2px; font-size:13px; }
  @media(max-width:480px){ .page-size-select{ margin-left:0; width:100%; order:10; } }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--primary-dark); color:#fff; padding:12px 22px; border-radius:100px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:200;
    max-width:90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="site-header">
  <a class="logo-wrap" href="index.html">
    <span class="brand">WEZIDE</span>
  </a>
  <a class="btn btn-ghost" href="index.html">← กลับหน้าแรก</a>
</header>

<div class="page-head">
  <h1>🕓 ประวัติหัวข้อ</h1>
  <p>รวมหัวข้อที่จบการโหวตไปแล้ว ย้อนดูผลลัพธ์กันได้ที่นี่</p>
</div>

<div class="filter-bar">
  <div class="sort-row">
    <div class="view-toggle" id="sortToggle">
      <button data-sort="latest" class="active">ล่าสุด</button>
      <button data-sort="popular">ยอดนิยม</button>
    </div>
  </div>
  <div class="pill-row" id="categoryPills"></div>
  <div class="result-count" id="resultCount"></div>
</div>

<main class="history-list" id="historyList">
  <div class="area-loading"><div class="area-spinner"></div>กำลังโหลด...</div>
</main>
<div class="pagination-row" id="paginationRow"></div>

<div id="toast"></div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwUBBRSKVfEkr-FmanTnQ1pHDD_-gNQ53pWkzHLvm3kvDWSTu-ARtV70yXiuN8hep8Gmg/exec'
};

let STATE = {
  categories: [],
  activeCategory: '',
  sortMode: 'latest',
  page: 1,
  pageSize: 20,
  totalCount: 0,
  totalPages: 1,
  topics: []
};

/* ---------- API helper (เหมือน index.html/profile.html ใส่ timeout 20 วิกันปุ่มค้าง) ---------- */
async function api(action, params = {}, method = 'GET'){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try{
    if(method === 'GET'){
      const qs = new URLSearchParams({action, ...params}).toString();
      const res = await fetch(`${CONFIG.API_URL}?${qs}`, { signal: controller.signal });
      return await res.json();
    } else {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        body: JSON.stringify({action, ...params}),
        signal: controller.signal
      });
      return await res.json();
    }
  }catch(err){
    // กันทุกกรณี error ไม่ให้หลุดเป็น unhandled exception ที่ทำให้หน้าจอค้างเป็น spinner ตลอดกาล
    return { success:false, message:'โอ๊ะ! มีบางอย่างขัดข้อง ทำให้ระบบสะดุดครับ ลองรีเฟรชใหม่อีกครั้งนะครับ' };
  }finally{
    clearTimeout(timeoutId);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ---------- Category filter ---------- */
async function loadCategories(){
  const res = await api('getCategories');
  STATE.categories = res.success ? res.categories : [];
  const wrap = document.getElementById('categoryPills');
  wrap.innerHTML = '';
  const allPill = document.createElement('button');
  allPill.className = 'category-pill selected';
  allPill.textContent = 'All';
  allPill.addEventListener('click', ()=> selectCategory('', allPill));
  wrap.appendChild(allPill);

  STATE.categories.forEach(cat=>{
    const pill = document.createElement('button');
    pill.className = 'category-pill';
    pill.textContent = cat;
    pill.addEventListener('click', ()=> selectCategory(cat, pill));
    wrap.appendChild(pill);
  });
}

function selectCategory(cat, el){
  STATE.activeCategory = cat;
  STATE.page = 1;
  document.querySelectorAll('.category-pill').forEach(p=> p.classList.remove('selected'));
  if(el) el.classList.add('selected');
  loadHistory();
}

document.getElementById('sortToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-sort]');
  if(!btn) return;
  STATE.sortMode = btn.dataset.sort;
  STATE.page = 1;
  document.querySelectorAll('#sortToggle button').forEach(b=> b.classList.toggle('active', b === btn));
  loadHistory();
});

/* ---------- Load + render ---------- */
async function loadHistory(){
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = `<div class="area-loading"><div class="area-spinner"></div>กำลังโหลด...</div>`;

  const params = { page: STATE.page, page_size: STATE.pageSize, sort: STATE.sortMode };
  if(STATE.activeCategory) params.category = STATE.activeCategory;

  const res = await api('getTopicHistory', params);
  if(!res.success){
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div>${escapeHtml(res.message || 'โหลดข้อมูลไม่สำเร็จ')}</div>`;
    document.getElementById('paginationRow').innerHTML = '';
    document.getElementById('resultCount').textContent = '';
    return;
  }

  STATE.topics = res.topics;
  STATE.totalCount = res.count;
  STATE.totalPages = res.total_pages;
  STATE.page = res.page;
  STATE.pageSize = res.page_size;

  document.getElementById('resultCount').innerHTML = STATE.totalCount
    ? `พบ <b>${STATE.totalCount}</b> หัวข้อที่จบการโหวตแล้ว`
    : '';

  if(STATE.topics.length === 0){
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">🗂️</div>ยังไม่มีหัวข้อที่จบการโหวตในหมวดนี้</div>`;
    document.getElementById('paginationRow').innerHTML = '';
    return;
  }

  listEl.innerHTML = STATE.topics.map(historyCardHTML).join('');
  renderPagination();
}

// การ์ดบาง แคบ ไม่มีรูป: title + description (บรรทัดเดียว) + แท่งสัดส่วน A/B วิ่งซ้าย->ขวา + % กำกับ (ฝั่งชนะตัวหนา) + total vote
function historyCardHTML(t){
  const total = t.total_votes || 0;
  const aPct = t.side_a_percent || 0;
  const bPct = t.side_b_percent || 0;
  const aWin = total > 0 && aPct > bPct;
  const bWin = total > 0 && bPct > aPct;

  return `
    <div class="history-card">
      <div class="hc-top">
        <div class="hc-title">${escapeHtml(t.title)}</div>
        ${t.category ? `<span class="hc-cat">${escapeHtml(t.category)}</span>` : ''}
      </div>
      ${t.description ? `<div class="hc-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="hc-bar">
        <span class="a" style="width:${aPct}%"></span>
        <span class="b" style="width:${bPct}%"></span>
      </div>
      <div class="hc-result">
        <span class="hr-total">${total} โหวต (100%)</span>
        <span class="hr-row${aWin ? ' win' : ''}"><i class="hr-dot" style="background:var(--side-a)"></i>${aWin ? '🏆 ' : ''}${escapeHtml(t.side_a_label)} (${aPct}%)</span>
        <span class="hr-row${bWin ? ' win' : ''}"><i class="hr-dot" style="background:var(--side-b)"></i>${bWin ? '🏆 ' : ''}${escapeHtml(t.side_b_label)} (${bPct}%)</span>
      </div>
    </div>`;
}

function renderPagination(){
  const el = document.getElementById('paginationRow');
  if(STATE.totalCount === 0){ el.innerHTML = ''; return; }

  const cur = STATE.page;
  const total = STATE.totalPages;

  const pages = [];
  const addPage = n => pages.push(n);
  const windowStart = Math.max(2, cur - 1);
  const windowEnd = Math.min(total - 1, cur + 1);
  addPage(1);
  if(windowStart > 2) pages.push('...');
  for(let n = windowStart; n <= windowEnd; n++) addPage(n);
  if(windowEnd < total - 1) pages.push('...');
  if(total > 1) addPage(total);

  const pageBtns = pages.map(n =>
    n === '...'
      ? `<span class="page-ellipsis">…</span>`
      : `<button class="page-btn${n === cur ? ' active' : ''}" data-page="${n}">${n}</button>`
  ).join('');

  el.innerHTML = `
    <button class="page-btn" data-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>‹</button>
    ${pageBtns}
    <button class="page-btn" data-page="${cur + 1}" ${cur >= total ? 'disabled' : ''}>›</button>
    <select class="page-size-select" id="pageSizeSelect">
      <option value="20" ${STATE.pageSize===20?'selected':''}>แสดง 20 / หน้า</option>
      <option value="50" ${STATE.pageSize===50?'selected':''}>แสดง 50 / หน้า</option>
      <option value="100" ${STATE.pageSize===100?'selected':''}>แสดง 100 / หน้า</option>
    </select>
  `;

  el.querySelectorAll('.page-btn[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.page, 10);
      if(!n || n < 1 || n > STATE.totalPages || n === STATE.page) return;
      STATE.page = n;
      loadHistory();
      document.getElementById('historyList').scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  document.getElementById('pageSizeSelect').addEventListener('change', (e)=>{
    STATE.pageSize = parseInt(e.target.value, 10);
    STATE.page = 1;
    loadHistory();
  });
}

/* ---------- Init ---------- */
(async function init(){
  await loadCategories();
  await loadHistory();
})();
</script>
</body>
</html>
